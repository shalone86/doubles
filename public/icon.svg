<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#ff8a00"/>
  <!-- Mirror Ladybug / Twin Doubler Card -->
  <rect x="14" y="22" width="100" height="84" rx="18" fill="#fffaf0" stroke="#2b2340" stroke-width="5"/>
  <line x1="64" y1="26" x2="64" y2="102" stroke="#ff8a00" stroke-width="4" stroke-dasharray="6 5"/>
  <!-- Left 3 dots -->
  <circle cx="38" cy="44" r="9" fill="#ef4444"/>
  <circle cx="38" cy="64" r="9" fill="#2563eb"/>
  <circle cx="38" cy="84" r="9" fill="#16a34a"/>
  <!-- Right 3 mirror dots -->
  <circle cx="90" cy="44" r="9" fill="#ef4444"/>
  <circle cx="90" cy="64" r="9" fill="#2563eb"/>
  <circle cx="90" cy="84" r="9" fill="#16a34a"/>
</svg>
